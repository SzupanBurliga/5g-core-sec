# Faza 4 / 06 — ograniczenie dostępu do secrets przez RBAC.
# Domyślnie żaden SA CNF nie ma prawa get/list secrets (brak Role = brak prawa,
# wzmocnione przez automountServiceAccountToken:false z 03). Tu jawnie:
# tworzymy Role pozwalającą czytać TYLKO konkretny sekret i wiążemy go z SA,
# który faktycznie go potrzebuje (przykład: UDR -> secret mongodb).
#
# Uwaga: samo montowanie sekretów jako PLIKI (a nie env) ustawia się w
# manifestach/charcie podów — patrz komentarz na końcu. Ten plik rządzi
# dostępem przez API k8s.
---
# Rola: odczyt wyłącznie nazwanego sekretu mongodb (zawęź resourceNames do
# realnej nazwy sekretu w Twoim wdrożeniu — sprawdź: kubectl get secret -n free5gc).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-mongodb-secret
  namespace: free5gc
  labels: { app: free5gc, hardening: "06" }
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["mongodb"]   # dostosuj do faktycznej nazwy sekretu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: udr-read-mongodb-secret
  namespace: free5gc
  labels: { app: free5gc, hardening: "06" }
subjects:
  - kind: ServiceAccount
    name: sa-udr
    namespace: free5gc
roleRef:
  kind: Role
  name: read-mongodb-secret
  apiGroup: rbac.authorization.k8s.io
# ---------------------------------------------------------------------------
# Montowanie sekretu jako PLIK (zamiast env) — wzór w spec poda:
#
#   volumes:
#     - name: mongo-cred
#       secret:
#         secretName: mongodb
#   containers:
#     - name: udr
#       volumeMounts:
#         - name: mongo-cred
#           mountPath: /etc/free5gc/cred
#           readOnly: true
#
# Dzięki temu sekret nie pojawia się w `env` przejętego poda (odpowiedź na S4).
# ---------------------------------------------------------------------------
